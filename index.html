const app=document.getElementById('app');const KEY='jwa-nation-ending-v1';let state=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=x=>Math.max(0,Math.min(100,x));
const labels={cash:'🪙 현금',mental:'🧠 멘탈',skill:'📚 실무력',sigh:'😮‍💨 엄마의 한숨'};
stages[1].age='20세 · 대학 축제';stages[2].c2.text='🛵 일자리를 옮기고 근무기록을 정리해 대응한다';stages[2].c2.comment='동료: 현실과 타협했네. 주인공: 월세와 협상했습니다.';
stages[4].c2.cash=-8;stages[4].c2.comment='가상 시장: 계약서는 썼지만 수익은 아직 오지 않았다.';
stages[5].c1.text='📢 경비원 근무환경 개선안을 입주자대표회의에 제안한다';stages[6].c2.cash=5;
const extra=[
{age:'25세 · 단체 활동',title:'우리 단체의 노동권',avatar:'🦉',text:'과로 반대 기자회견 준비를 위해 주말 철야를 부탁받았다.',choices:[
{text:'🛋️ 행사 규모를 줄이고 휴무를 지킨다',cash:-2,mental:7,skill:5,value:'일관성',nation:{trust:6,execution:4},line:'사무국장: 원칙을 우리에게도 적용할 줄은 몰랐네요.'},
{text:'🚩 이번만 대의를 위해 철야한다',cash:0,mental:-12,value:'명분',nation:{trust:-4,execution:-2},line:'선배: 우리는 돈 때문에 일하지 않잖아. 후배: 그래서 임금도 없나요?'}]},
{age:'35세 · 지원사업',title:'청년의 범위가 예산보다 빠르다',avatar:'🎁',text:'이제 공적 사업의 결정에 참여한다. 대상 확대 요구는 커지는데 재원은 그대로다.',choices:[
{text:'📣 모두에게 주겠다고 먼저 발표한다',cash:0,mental:1,value:'명분',nation:{fiscal:-15,trust:-5,livelihood:4},line:'대변인: 재원은 관계 부처와 긴밀히 상상 중입니다.'},
{text:'🧮 대상·금액·재원을 공개해 조정한다',cash:0,mental:-5,skill:7,value:'실용',nation:{fiscal:3,trust:5,livelihood:2},line:'민원: 왜 비용을 굳이 알려서 기분 나쁘게 하나요?'}]},
{age:'43세 · 정책회의',title:'기업도 남고 싶어 할까',avatar:'🏭',text:'기업은 투자 조건을, 단체는 부담금 강화를 요구한다. 당신의 제안이 정책회의에 반영된다.',choices:[
{text:'📢 비용 검토 없이 추가 부담부터 발표한다',cash:0,mental:1,value:'명분',nation:{investment:-12,fiscal:2,trust:-3},line:'브리핑: 투자를 환영합니다. 환영 비용은 투자자가 부담합니다.'},
{text:'🤝 지원 조건과 투자 약속의 이행을 함께 검증한다',cash:0,mental:-5,skill:6,value:'실용',nation:{investment:7,execution:6,fiscal:-3},line:'기업: 지원을 요청합니다. 담당자: 약속도 서면으로 부탁합니다.'}]},
{age:'52세 · 국제회의',title:'국내용 구호의 환율',avatar:'🌍',text:'가상 국제협상에서 외교 대표단에 의견을 전달한다. 상대는 구호보다 조건을 묻는다.',choices:[
{text:'📡 국내 지지자를 향해 강경 선언한다',cash:0,mental:0,value:'명분',nation:{external:-10,trust:-3},line:'가상 외교관: 귀국 지지율은 이해합니다. 계약서에는 반영하지 않겠습니다.'},
{text:'📑 원칙과 거래 조건을 나눠 협상한다',cash:0,mental:-5,skill:6,value:'실용',nation:{external:7,execution:4},line:'회의실에 박수는 없었지만 수정된 문서가 남았다.'}]},
{age:'57세 · 결과발표',title:'지표가 우리 편이 아니다',avatar:'📺',text:'정책 결과가 예상과 달랐다. 홍보팀이 비교기간 변경을 제안한다.',choices:[
{text:'✂️ 유리한 구간만 잘라 발표한다',cash:0,mental:2,value:'예외',nation:{trust:-13,execution:-6},line:'성과보고: 그래프의 시작점을 옮기자 정책이 개선됐습니다.'},

function original(i){const s=stages[i];return {...s,choices:[s.c1,s.c2].map((c,j)=>({...c,mental:j===0?-4:2,skill:j===0?3:1,value:j===0?'연대':'생활',nation:{},line:c.comment||'가상 반응: 마지막 장면이 지나갔다. 이제 기록을 읽을 시간이다.'}))}}
const events=[original(1),original(2),extra[0],original(3),extra[1],original(4),extra[2],original(5),extra[3],extra[4],original(6)];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function home(){app.innerHTML=`<div class="poster"><div class="sprite">🎭 🧾</div><h1>좌아하게</h1><p>대한민국에서 좌파로 살기<br>명분은 무한, 예산은 유한</p></div><div class="quote">세상을 바꾸겠다고 한 당신.<br>마지막에 남는 것은 어떤 사람, 어떤 나라일까요?</div><div class="row"><button class="primary" onclick="start()">🎲 새 인생 시작</button>${load()?'<button onclick="resume()">💾 이어하기</button>':''}</div><div class="notice">가상 인물·정책·국가의 창작 시뮬레이션입니다. 국가 결과는 사회 전체의 실제 예측이 아니며 개인의 일상 선택이 국가를 직접 바꾼다는 뜻도 아닙니다.</div>`}
function start(){state={step:0,cash:35,debt:0,mental:80,skill:20,sigh:10,trained:false,result:null,finished:false,values:{'명분':0,'연대':0,'생활':0,'실용':0,'일관성':0,'예외':0},nation:{fiscal:55,investment:55,livelihood:50,trust:55,execution:50,external:55},history:[]};save();play()}
function resume(){state=load();if(state)play()}
function apply(c){state.cash+=c.cash||0;if(state.cash<0){state.debt-=state.cash;state.cash=0}for(const k of ['mental','skill','sigh'])state[k]=clamp(state[k]+(c[k]||0));}
function dashboard(){return `<div class="grid">${Object.entries(labels).map(([k,t])=>`<div class="stat">${t}<strong>${state[k]}${k==='cash'?'万':''}</strong></div>`).join('')}</div>`.replace('万','만')}
function play(){if(state.finished)return ending();if(state.result)return result();const e=events[state.step];app.innerHTML=`<div class="row noprint"><button onclick="home()">🏠 타이틀</button></div><div class="badge">LIFE ${state.step+1} / ${events.length} · ${e.age}</div><progress value="${state.step}" max="${events.length}"></progress>${dashboard()}<h3>🎒 오늘의 하루</h3><div class="row">${[['study','📚 자료 읽기'],['work','🛵 유급 일감'],['rest','🛋️ 잠깐 쉬기']].map(([k,t])=>`<button ${state.trained?'disabled':''} onclick="train('${k}')">${t}</button>`).join('')}</div><div class="hero"><div class="sprite">${e.avatar}</div><div><h2>${e.title}</h2><p>${e.text}</p></div></div>${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${['🅰️','🅱️'][i]} ${c.text}</button>`).join('')}`}
function train(k){if(state.trained||state.result||state.finished)return;const x={study:{cash:-2,skill:6},work:{cash:5,mental:-4},rest:{mental:8}}[k];if(!x)return;apply(x);state.trained=true;save();play()}
function choose(i){if(state.result||state.finished)return;const e=events[state.step],c=e.choices[i];if(!c)return;apply(c);apply({cash:-3});state.values[c.value]++;for(const[k,v]of Object.entries(c.nation))state.nation[k]=clamp(state.nation[k]+v);state.history.push({title:e.title,text:c.text,value:c.value,nation:{...c.nation},line:c.line});state.result={line:c.line};save();result()}
function result(){const e=events[state.step];app.innerHTML=`<div class="hero"><div class="sprite">${e.avatar}</div><div><span class="badge">🎬 선택 이후</span><h2>${e.title}</h2></div></div><div class="bubble">💬 ${esc(state.result.line)}</div><p>당신의 말과 행동이 기록에 남았습니다.</p><button class="primary" onclick="next()">${state.step===events.length-1?'🧾 나와 국가의 결말 보기':'🎲 다음 장면'}</button>`}
function next(){if(!state.result)return;state.result=null;state.step++;state.trained=false;if(state.step===events.length)state.finished=true;save();play()}
function personal(){const v=state.values;if(v['예외']>0&&v['명분']>=2)return {title:'🎭 원칙은 보편적, 예외는 개인적',quote:'내 신념은 변하지 않았다. 적용 대상만 조금씩 달라졌다.',desc:'대외적으로 명분을 강조하면서 불리한 성과는 선택적으로 설명했다. 자기 입장을 지키는 일과 책임을 지는 일이 갈라졌다.'};if(v['일관성']>=2&&v['실용']>=2)return {title:'🧭 구호보다 실행을 택한 개혁가',quote:'박수는 줄어도 고칠 수 있는 것은 고치기로 했다.',desc:'조직에도 원칙을 적용하고 결과가 다르면 수정을 택했다. 내부 비판을 감수하면서도 실행과 검증을 우선했다.'};if(v['명분']>=3)return {title:'🚩 명분을 끝까지 지킨 신념가',quote:'현실이 따라오지 못해도 방향만은 옳다고 믿었다.',desc:'당장의 성과와 검증보다 선언의 선명함을 자주 우선했다. 신념을 유지했지만 실패를 인정할 공간은 좁아졌다.'};if(v['생활']>=4)return {title:'🏡 생활을 먼저 지킨 현실주의자',quote:'세상을 구하는 일도 내 생활이 버텨야 계속할 수 있었다.',desc:'일상에서 생계와 자산을 자주 우선했다. 생활의 안정은 얻었지만 처음의 연대와 어떤 거리가 생겼는지는 스스로 돌아봐야 한다.'};return {title:'🤝 연대와 생활 사이의 조정자',quote:'완벽한 선택 대신 내가 감당할 선택을 찾았다.',desc:'한 가지 원칙만으로 모든 장면을 통과하지 않았다. 타협과 연대, 생활과 책임 사이에서 매번 다른 균형을 선택했다.'}}
const nlabels={fiscal:'🏦 재정 여력',investment:'🏭 투자 환경',livelihood:'🧺 생활 여건',trust:'🤝 제도 신뢰',execution:'🛠️ 집행 역량',external:'🌍 대외 협력'};
function level(k,x){if(k==='fiscal')return x<40?'청구서가 먼저 도착하는 재정':x>=60?'지출 우선순위를 유지하는 재정':'선택의 비용을 조정 중인 재정';if(k==='investment')return x<48?'새 투자를 망설이는 기업들':x>=60?'조건을 확인하며 움직이는 투자':'기다림과 투자가 공존하는 시장';if(k==='livelihood')return x>=53?'일부 지원의 체감, 지속성은 과제':'지원과 생활비 사이에서 버티는 가계';if(k==='trust')return x<48?'발표보다 검증을 요구하는 시민':x>=60?'불편한 설명도 듣는 시민':'기대와 의심이 공존하는 시민';if(k==='execution')return x<48?'계획보다 홍보가 빠른 행정':x>=60?'평가와 수정이 작동하는 행정':'발표를 집행으로 옮기는 중인 행정';return x<50?'국내용 발언을 경계하는 상대국':x>=60?'조건을 맞추며 협상하는 외교':'공통 이익을 찾는 중인 외교'}
function national(){const n=state.nation;if(n.fiscal<45&&n.investment<50&&n.trust<50)return ['🌧️ 명분은 남고 회복력은 약해진 나라','재원 검토 없는 확대와 협의 없는 부담, 불리한 성과의 편집이 겹쳤다. 당장의 혜택은 있었지만 추가 청구서와 투자 지연, 신뢰의 손상이 이어졌다. 이 엔딩은 재정·정책 위험의 가상 서사이며 실제 부도나 IMF 지원을 판정한 결과가 아니다.'];if(n.trust>=60&&n.execution>=60&&n.investment>=55)return ['🌤️ 박수는 작지만 수정이 가능한 나라','완벽한 합의는 없었다. 대신 비용과 조건을 설명하고, 성과가 부족하면 고치는 절차가 남았다. 정치적 구호보다 느리지만 집행과 협력의 기반이 유지됐다.'];return ['🌥️ 버티고 있지만 숙제가 남은 나라','지원과 비용, 투자와 부담, 원칙과 협상이 서로 다른 방향으로 움직였다. 완전한 붕괴도 완전한 성공도 아니다. 다음 결산에서 무엇을 수정할지가 남았다.']}
function ending(){const p=personal(),[nt,nd]=national();const contributing=state.history.filter(h=>Object.keys(h.nation).length);app.innerHTML=`<div class="poster"><div class="sprite">🎭 🏛️</div><h1>나의 인생,<br>국가의 다음 장</h1><span class="badge">당신의 누적 선택으로 작성한 가상 결산</span></div><section class="box"><h2>👤 당신은 어떤 사람이 되었나</h2><h3>${p.title}</h3><div class="quote">“${p.quote}”</div><p>${p.desc}</p><p>${state.mental<30?'무리한 활동으로 피로가 깊어졌다.':state.mental>=70?'생활 속 휴식과 활동의 균형을 비교적 지켰다.':'활동의 피로와 생활의 필요를 함께 감당했다.'} ${state.debt>0?'생활비가 부족했던 시기의 빚도 남았다.':'현재 장부에는 개인 부채가 남지 않았다.'}</p><details><summary>📜 가치관을 드러낸 선택 보기</summary>${state.history.map(h=>`<p><span class="badge">${h.value}</span> ${h.title}<br>${h.text}</p>`).join('')}</details></section><section class="box"><h2>🏛️ 그 사이 국가는 어떻게 되었나</h2><h3>${nt}</h3><p>${nd}</p><div class="grid">${Object.entries(state.nation).map(([k,x])=>`<div class="box"><h3>${nlabels[k]}</h3><p>${level(k,x)}</p></div>`).join('')}</div><details><summary>🧩 국가 장부에 반영된 공적 선택</summary>${contributing.map(h=>`<div class="scene">${h.title}<br>${h.text}</div>`).join('')}</details><p class="small">일상 선택은 개인 가치관에만 반영했습니다. 지원사업·기업정책·국제협상·행정 운영 같은 공적 선택만 국가 장부에 반영합니다. 전체 경제를 설명하는 실증 모형은 아닙니다.</p></section><section class="box"><h2>📰 가상 시민의 마지막 한마디</h2><div class="bubble">${state.nation.trust<50?'“설명은 많았는데, 내 삶이 왜 이 모양인지에 대한 답은 못 들었습니다.”':'“모든 정책에 찬성하지는 않습니다. 그래도 비용과 결과를 숨기지는 않았습니다.”'}</div><div class="quote">엄마: “나라 이야기도 좋다. 너는 밥 먹고 다니니?”</div></section><details><summary>🎒 최종 개인 상태</summary>${dashboard()}<p>개인 부채 ${state.debt}만 · 모두 게임 내 가상값</p></details><div class="notice">현실 대한민국의 국가 상태와 다른 창작 결과입니다. 실제 통계·자살·이혼·출산·증시 수치를 이 결론에 맞춰 만들어 넣지 않았습니다. 국가는 한 개인의 선택만으로 결정되지 않습니다.</div><div class="row"><button onclick="window.print()">🖨️ 결산 인쇄</button><button onclick="download()">💾 결산 저장</button><button onclick="home()">🎲 다시 태어나기</button></div>`}
function download(){const p=personal(),n=national(),txt=`좌아하게 — 나의 인생, 국가의 다음 장\n\n[가치관]\n${p.title}\n${p.quote}\n${p.desc}\n\n[가상 국가]\n${n[0]}\n${n[1]}\n\n${Object.entries(state.nation).map(([k,v])=>nlabels[k]+': '+level(k,v)).join('\n')}\n\n[선택 기록]\n${state.history.map(h=>h.title+': '+h.text).join('\n')}\n\n게임의 창작 결과이며 실제 한국의 예측·국가부도 판정이 아닙니다.`;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='좌아하게_인생과국가_결산.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
home();
</script></body></html>
