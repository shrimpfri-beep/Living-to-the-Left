c('✂️ 유리한 구간만 잘라 발표한다',{rational:12,trust:-9},'성과보고: 그래프의 시작점을 옮기자 정책이 개선됐습니다.'),c('🔦 실패와 외부 요인을 구분해 공개한다',{skill:7,trust:9,mental:-5},'기자: 실패를 인정하나요? 주인공: 자막도 그렇게 부탁합니다.'),c('🔎 독립 평가를 의뢰한다',{cash:-5,skill:8,trust:7},'평가위원: 결론을 미리 주시진 않는 거죠?')])];
const ordered=[events[0],events[1],added[0],added[1],events[2],added[2],events[3],added[3],added[4],events[4],added[5],added[6],added[7],events[5]];events.splice(0,events.length,...ordered);
function clamp(v){return Math.max(0,Math.min(100,v))}function apply(e){for(const [k,v]of Object.entries(e)){state[k]+=v;if(k!=='cash')state[k]=clamp(state[k])}if(state.cash<0){state.debt-=state.cash;state.cash=0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function stored(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function nav(){return `<nav><button onclick="home()">🏠 타이틀</button>${state?'<button onclick="play()">🎮 인생으로</button>':''}<button onclick="info()">📚 게임·자료 안내</button></nav>`}
function home(){app.innerHTML=`<div class="poster"><div class="cast">🧑‍🎓 📣 🧑‍💼</div><h1>좌아하게</h1><p>대한민국에서 좌파로 살기<br><span class="badge">명분은 무한, 예산은 유한</span></p></div>${nav()}<div class="quote">“세상을 바꾸겠다고 했는데,<br>왜 내 앞으로 청구서가 오는 걸까?”</div><p>어묵탕을 팔던 대학생부터 회의에 지친 어른까지.<br>명분과 생활 사이에서 당신만의 인생을 키워보세요.</p><div class="row"><label>🎒 출신 배경 <select id="background"><option value="field">현장 실무자</option><option value="study">정책 연구자</option><option value="donor">전문직 후원자</option></select></label></div><div class="row"><button class="primary" onclick="start()">🎲 새 인생 시작</button>${stored()?'<button onclick="resume()">💾 이어서 살기</button>':''}</div><div class="notice">인물·대사·커뮤니티 반응은 창작입니다. 선택의 능력치 효과는 미리 알려드리지 않습니다. 이 버전의 수치는 실제 정책·자산 예측이 아닙니다.</div>`}
function start(){const b=document.getElementById('background').value;state={version:3,bg:b,step:0,cash:35,debt:0,mental:80,skill:20,trust:45,sigh:10,rational:10,history:[],trained:false,result:null,finished:false};if(b==='study')apply({skill:12});if(b==='donor')apply({cash:20,rational:8});if(b==='field')apply({trust:10});save();play()}
function resume(){const s=stored();if(s?.version!==3)return;state=s;play()}
function stats(){return `<div class="stats">${Object.entries(labels).map(([k,label])=>`<div class="stat">${label}<strong>${Math.round(state[k])}${k==='cash'?'만':''}</strong>${k!=='cash'?`<div class="bar"><div class="fill" style="width:${state[k]}%"></div></div>`:''}</div>`).join('')}</div><div class="small">게임 내 가상 상태 · 개인 부채 ${state.debt}만</div>`}
function play(){if(!state)return home();if(state.finished)return ending();if(state.result)return result();const e=events[state.step];app.innerHTML=`${nav()}<div class="episode">LIFE ${String(state.step+1).padStart(2,'0')} / ${events.length} · ${e.age}</div><progress value="${state.step}" max="${events.length}"></progress>${stats()}<h3>🎒 이번에는 어떻게 보낼까?</h3><div class="row">${[['study','📚 자료 읽기'],['work','🛵 유급 일감'],['rest','🛋️ 잠깐 쉬기']].map(([k,t])=>`<button onclick="train('${k}')" ${state.trained?'disabled':''}>${t}</button>`).join('')}</div><small>장면마다 한 번. 공부도, 밥벌이도, 휴식도 인생에 남습니다.</small><div class="hero"><div class="avatar">${e.avatar}</div><div><span class="episode">오늘의 인생극장</span><h2>${e.title}</h2><p>${e.text}</p></div></div>${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="pick">${'ABC'[i]}</span><span>${c.text}</span></button>`).join('')}<p class="small">선택지에 정답표는 없습니다. 인물의 말과 다음 장면을 읽어보세요.</p>`}
function train(k){if(state.trained||state.result||state.finished)return;const t={study:{skill:6,cash:-2},work:{cash:5,mental:-4},rest:{mental:8,sigh:-2}};if(!t[k])return;if(k==='study'&&state.cash<2)return alert('자료를 준비할 여유가 부족합니다. 다른 하루를 보내보세요.');apply(t[k]);state.trained=true;save();play()}
function choose(i){if(!state||state.result||state.finished)return;const e=events[state.step],c=e.choices[i];if(!c)return;apply(c.effect);apply({cash:-3});let note=state.debt>0?'생활비 고지서 옆에 빚 청구서가 놓였다. 대의는 다음 달로 미룰 수 있어도 자동이체는 기다리지 않았다.':'이야기가 넘어가는 사이 생활비가 빠져나갔다. 세상은 그대로인데 자동이체는 성실했다.';if(state.rational>55){apply({trust:-2});note+=' 질문이 들어오자 답보다 해명이 먼저 나왔다.'}if(state.mental<25){apply({skill:-2});note+=' 같은 문장을 세 번 읽었다. 오늘은 커피도 당신을 설득하지 못했다.'}state.history.push({title:e.title,text:c.text,line:c.line});state.result={line:c.line,note};save();result()}
function result(){const e=events[state.step];app.innerHTML=`${nav()}<div class="hero"><div class="avatar">${e.avatar}</div><div><span class="episode">🎬 당신의 선택, 그 다음</span><h2>${e.title}</h2><p>누구는 박수를 치고,<br>누구는 계산서를 펼칩니다.</p></div></div><div class="bubble">💬 ${escapeHtml(state.result.line)}</div><div class="box"><h3>📮 그 뒤에 도착한 소식</h3><p>${state.result.note}</p></div><button class="primary" onclick="next()">${state.step===events.length-1?'🧾 인생 결산 보기':'🎲 다음 인생 장면'}</button>`}
function next(){if(!state.result)return;state.result=null;state.step++;state.trained=false;if(state.step===events.length)state.finished=true;save();play()}
function verdict(){if(state.rational>=55)return ['🎭 원칙은 그대로, 예외는 나에게','원칙은 한 번도 바뀌지 않았다. 적용 대상만 매번 바뀌었다.'];if(state.mental<25||state.debt>40)return ['🦉 번아웃된 연대의 회계담당','세상을 구하려던 일정표에 자신의 휴식은 없었다.'];if(state.skill>=65&&state.trust>=65)return ['🧑‍💻 불편한 타협의 실무자','구호는 짧아졌고 고쳐진 문제는 남았다. 내부에선 변절인지 성장인지 토론 중이다.'];if(state.cash>=80)return ['🏡 생활의 안정을 찾은 후원자','후원은 이어졌지만 먼저 확인하는 것은 자동이체 잔액이 되었다.'];return ['📣 명분과 생활 사이의 생존자','선언과 청구서 사이에서 조금씩 다른 어른이 되었다.']}
function ending(){const [t,d]=verdict();app.innerHTML=`<div class="poster"><div class="cast">🎭 🧾 🏁</div><h1>인생의 청구서</h1></div>${nav()}<h2>${t}</h2><p>${d}</p>${stats()}<div class="quote">“정책의 방향은 옳았습니다.<br>다만 제 생활이 그 방향으로 움직이지 않았습니다.”<br><small>창작 대사</small></div><h3>📜 당신이 남긴 발자국</h3>${state.history.map((h,i)=>`<div class="record"><span class="badge">EP ${i+1}</span> ${h.title}<p>${h.text}</p><small>💬 ${escapeHtml(h.line)}</small></div>`).join('')}<div class="row"><button onclick="window.print()">🖨️ 결산 인쇄</button><button onclick="home()">🎲 다시 태어나기</button></div><div class="notice">가상 인생의 결산입니다. 실제 국가 통계나 특정 정책의 인과효과를 뜻하지 않습니다.</div>`}
function info(){app.innerHTML=`<h2>📚 게임과 자료 안내</h2>${nav()}<div class="box"><h3>🎮 어떻게 플레이하나요?</h3><p>하루의 육성 행동을 고르고 사건에 답합니다. 선택 후에는 대사와 상황만 보여줍니다. 현재 상태는 다음 사건과 최종 결산에서 확인할 수 있습니다. 마지막 선택만이 아니라 인생 전체가 결말에 반영됩니다.</p></div><div class="box"><h3>🔎 현실 자료 출발점</h3><p><a href="https://ecos.bok.or.kr/" target="_blank" rel="noopener">한국은행 ECOS</a> · 성장·금리·환율</p><p><a href="https://www.openfiscaldata.go.kr/op/ko/index" target="_blank" rel="noopener">열린재정</a> · 예산·결산·채무</p><p><a href="https://data.krx.co.kr/" target="_blank" rel="noopener">한국거래소</a> · 증시</p><p><a href="https://kosis.kr/" target="_blank" rel="noopener">KOSIS</a> · 고용·물가·인구·가계</p><p><a href="https://www.bigkinds.or.kr/" target="_blank" rel="noopener">빅카인즈</a> · 뉴스 비교</p></div><div class="notice">이 버전은 첨부된 원본을 바탕으로 재구성했습니다. 실시간 데이터·통계 입력 도구·글로벌 랜덤 충격은 구현되어 있지 않습니다. 이모지는 기기마다 모양이 다를 수 있습니다. 저장은 이 브라우저에서만 유지됩니다. 새 인생은 기존 진행을 덮어씁니다.</div>`}
home();
</script></body></html>
