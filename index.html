<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>좌아하게: 대한민국에서 좌파로 살기 (확장 에디션)</title>
<style>
  :root {
    --desk: #121212; --paper: #F4F1EA; --ink: #1F1D1A; 
    --red: #C0392B; --orange: #D35400; --blue: #2980B9; --green: #27AE60;
  }
  body { background: var(--desk); color: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { width: 100%; max-width: 580px; background: var(--paper); color: var(--ink); padding: 24px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border-top: 6px solid var(--red); }
  
  .dashboard { background: #e8e2d4; padding: 12px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #dcd6c8; font-size: 13px; font-weight: bold; }
  .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
  .sigh-box { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--red); }
  .gauge-bar { flex-grow: 1; height: 8px; background: #d3cbb7; border-radius: 4px; overflow: hidden; }
  .gauge-fill { height: 100%; background: var(--red); width: 10%; transition: width 0.4s; }

  .avatar-room { background: #222; color: #fff; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 16px; border: 2px solid #333; }
  .avatar-emoji { font-size: 40px; margin-bottom: 4px; }
  .avatar-status { font-size: 13px; color: #aaa; }

  .stage-badge { font-size: 11px; color: var(--red); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
  .scenario { font-size: 16px; line-height: 1.6; margin-bottom: 20px; font-weight: 500; min-height: 70px; }
  
  .choice-btn { display: block; width: 100%; background: #fff; border: 1px solid #cec5b2; padding: 14px; margin-bottom: 12px; text-align: left; cursor: pointer; border-radius: 6px; font-size: 14px; font-weight: bold; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .choice-btn:hover { background: #fbf9f4; border-color: var(--ink); transform: translateX(3px); }
  
  .community-ticker { background: #111; color: #00ffcc; border: 1px solid #333; padding: 8px 12px; font-size: 12px; border-radius: 4px; margin-top: 15px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .title-screen { text-align: center; padding: 10px 0; }
  .tweet-box { background: #fff; border: 1px solid #dcd6c8; border-radius: 8px; padding: 15px; margin: 15px 0; text-align: left; }
  .start-btn { background: var(--red); color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 4px 10px rgba(192,57,43,0.3); }
  .start-btn:hover { background: #a93226; }
  
  .report-box { background: #fff; border: 1px dashed #999; padding: 15px; border-radius: 6px; font-size: 13px; margin: 15px 0; text-align: left; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>

<div class="container" id="app"></div>

<script>
let state = { cash: 30, mental: 100, sigh: 10, step: 1, history: [] };

const stages = {
  1: {
    age: "10대 · 학창 시절", title: "축제와 대자보", avatar: "🧑‍🎓",
    text: "학교 축제 주점 이름을 정해야 한다. 친구들과 의견이 갈린다.",
    c1: { text: "✊ '노동자의 연대' 주점 (메뉴: 노란봉투 어묵탕)", sigh: +20, cash: -2, tag: "진보/연대", comment: "에타: 또 과몰입 힙스터 등판했네 아오" },
    c2: { text: "🔥 무난하게 매출 최고를 노리는 '헌팅 마라탕' 주점", sigh: -10, cash: +10, tag: "보수/효율", comment: "인스타: 이게 청춘이지 암~" }
  },
  2: {
    age: "20대 · 대학 및 알바", title: "최저임금의 기로", avatar: "🧑‍💻",
    text: "편의점 야간 알바 중, 최저임금보다 적은 시급을 주겠다는 사장님. 월세는 코앞이다.",
    c1: { text: "📢 노동청 고발 및 캠퍼스 대자보 부착! '노동권은 사치 가 아니다'", sigh: +30, cash: -10, tag: "진보/정의", comment: "디시: 알바는 알바고 공부나 해라 ㅉㅉ" },
    c2: { text: "🤫 '당장 월급이 아쉬우니' 눈 감고 야간 알바 풀근무 뛰기", sigh: -15, cash: +20, tag: "보수/현실", comment: "블라인드: 사회생활 낄낄빠빠 잘하네" }
  },
  3: {
    age: "30대 · 직장 생활", title: "노조 가입의 갈등", avatar: "👨‍💼",
    text: "입사 후 처음으로 사내 노동조합 파업 결의안 투표가 진행된다. 회사의 눈치가 보인다.",
    c1: { text: "🚩 망설임 없이 노조 가입원서 작성 후 파업 선봉장 자처", sigh: +35, cash: -15, tag: "진보/투쟁", comment: "블라인드: 저분 인사고과 0순위 확정이네 묵념" },
    c2: { text: "☕ '회사가 살아야 내가 산다'며 파업 불참 및 특근 신청", sigh: -20, cash: +25, tag: "보수/사측", comment: "사내익명: 참된 직장인의 자세 칭찬해" }
  },
  4: {
    age: "38세 · 주택 마련", title: "영끌과 부동산", avatar: "👨‍🏠",
    text: "영혼까지 끌어모아 집을 사야 한다. 재개발 지역 아파트 청약에 눈이 간다.",
    c1: { text: "🏢 투기성 개발 반대! 공공임대 주택과 주거 복지 확대 지지", sigh: +25, cash: 0, tag: "진보/공공", comment: "뽐뿌: 평생 전전긍긍하다 거지 되는 조상 픽" },
    c2: { text: "📈 영끌(영혼까지 끌어모아) 재개발 아파트 청약 몰빵", sigh: -25, cash: +40, tag: "보수/자산", comment: "부동산스터디: 이분이 진짜 현명한 승리자네" }
  },
  5: {
    age: "48세 · 아파트 동대표", title: "주민 투표 안건", avatar: "👨‍⚖️",
    text: "어렵게 마련한 아파트의 동대표가 되었다. 첫 주민 투표 안건이 올라왔다.",
    c1: { text: "📢 임대주택 차별 반대 및 경비원 노동환경 개선 조례안 발의", sigh: +40, cash: -10, tag: "진보/복지", comment: "입주민단톡: 우리 집값 떨어지는 소리 안 들리나요?" },
    c2: { text: "🛡️ 우리 아파트 집값 하락 방지! 보안 강화 및 외부인 출입 금지", sigh: -30, cash: +20, tag: "보수/님비", comment: "입주민단톡: 동대표님 역시 현명하십니다 찬성!" }
  },
  6: {
    age: "60세+ · 황혼기", title: "은퇴와 여론전", avatar: "👴",
    text: "인생의 황혼기, 매일 커뮤니티와 라디오 시사 방송에 댓글을 남기는 은퇴 생활.",
    c1: { text: "🕊️ 끝까지 사회적 약자와 연대하는 진보 시민단체 후원 및 집회 참여", sigh: +30, cash: -20, ending: "left" },
    c2: { text: "🏡 안정적인 자산 관리와 노후 재테크(건물주)에 집중하며 평온하게 노후 즐기기", sigh: -40, cash: +80, ending: "right" }
  }
};

function renderMain() {
  document.getElementById('app').innerHTML = `
    <div class="title-screen">
      <h1 style="color:var(--red); font-size:28px; margin-bottom:5px;">좌아하게</h1>
      <div style="font-size:13px; color:#666; font-weight:bold; margin-bottom:15px;">대한민국에서 좌파로 살기 — 명분은 무한, 예산은 유한</div>
      
      <div class="tweet-box">
        <div style="font-weight:bold; font-size:14px; margin-bottom:4px;">이재명 ✔ <span style="font-size:12px; color:#777; font-weight:normal;">@Jaemyung_Lee</span></div>
        <div style="font-size:15px; line-height:1.4;">많이들 함께 해주세요<br><strong>좌아하게</strong> 말입니다.</div>
      </div>

      <p style="font-size:13px; color:#444; font-style:italic; margin:15px 0;">
        "모두를 위한 정책을 발표했다.<br>이제 모두가 서로 다른 이유로 화를 낸다."
      </p>

      <button class="start-btn" onclick="startGame()">인생 게임 시작하기 👍</button>
    </div>
  `;
}

function startGame() {
  state = { cash: 30, mental: 100, sigh: 10, step: 1, history: [] };
  renderGame();
}

function renderGame() {
  let stage = stages[state.step];
  if (!stage) return;

  document.getElementById('app').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="margin:0; font-size:18px; color:var(--red);">좌아하게: 생애 시뮬레이션</h2>
      <button onclick="renderMain()" style="background:none; border:none; color:#666; cursor:pointer; font-size:12px;">🏠 타이틀로</button>
    </div>

    <div class="dashboard">
      <div class="status-row">
        <span>👶 연령: ${stage.age}</span>
        <span>💰 자산: ${state.cash}만 원</span>
        <span>🧠 멘탈: ${state.mental}</span>
      </div>
      <div class="sigh-box">
        <span>😤 엄마의 한숨: ${state.sigh}%</span>
        <div class="gauge-bar"><div class="gauge-fill" style="width: ${state.sigh}%;"></div></div>
      </div>
    </div>

    <div class="avatar-room">
      <div class="avatar-emoji">${stage.avatar}</div>
      <div class="avatar-status">현재 국면: ${stage.title}</div>
    </div>

    <div class="stage-badge">Stage ${state.step} / 6</div>
    <div class="scenario">${stage.text}</div>

    <button class="choice-btn" onclick="makeChoice(1)">${stage.c1.text}</button>
    <button class="choice-btn" onclick="makeChoice(2)">${stage.c2.text}</button>

    <div class="community-ticker" id="ticker">💬 실시간 여론: 선택을 내려 반응을 확인하세요.</div>
  `;
}

function makeChoice(num) {
  let stage = stages[state.step];
  let choice = num === 1 ? stage.c1 : stage.c2;

  state.sigh = Math.max(0, Math.min(100, state.sigh + choice.sigh));
  state.cash += choice.cash;
  state.history.push({ title: stage.title, choice: choice.text, tag: choice.tag });

  document.getElementById('ticker').innerText = `${choice.comment}`;

  if (state.step >= 6) {
    setTimeout(() => showEnding(choice.ending), 600);
  } else {
    state.step++;
    setTimeout(renderGame, 600);
  }
}

function showEnding(type) {
  let historyHtml = state.history.map(h => `<li><b>[${h.tag}]</b> ${h.title}: ${h.choice}</li>`).join('');
  let app = document.getElementById('app');

  if (type === 'left') {
    app.innerHTML = `
      <h2>🏛️ 블랙코미디 풍자 리포트: 명분은 무한, 통장은 유한</h2>
      <p class="scenario">평생을 대의와 연대, 사회적 약자의 편에 서서 싸워온 당신. 어머니는 매일 깊은 한숨을 쉬셨고 통장은 가벼워졌지만, 커뮤니티와 역사 속에는 당신의 뼈 있는 발언들이 찬란하게 박제되었습니다.</p>
      
      <div class="report-box">
        <strong>📝 플레이어 일생 요약 기록:</strong>
        <ul>${historyHtml}</ul>
      </div>

      <p style="font-size:12px; font-style:italic; color:#555;">“정책은 성공했습니다. 지표와 통장 잔고만 동의하지 않았습니다.”</p>
      <button class="start-btn" onclick="renderMain()">🔄 다시 태어나기</button>
    `;
  } else {
    app.innerHTML = `
      <h2>🏡 블랙코미디 풍자 리포트: 현실주의자의 안락한 자산가</h2>
      <p class="scenario">이상보다는 현실의 지표와 자산을 선택한 당신. 어머니는 비로소 평온하게 미소 지으셨고, 통장 잔고와 건물은 든든합니다. 세상의 변화보다 내 자산의 평화가 소중했던 한 평생이었습니다.</p>
      
      <div class="report-box">
        <strong>📝 플레이어 일생 요약 기록:</strong>
        <ul>${historyHtml}</ul>
      </div>

      <p style="font-size:12px; font-style:italic; color:#555;">“박수는 줄었지만 민원은 없고, 자산은 늘었습니다.”</p>
      <button class="start-btn" style="background:var(--blue);" onclick="renderMain()">🔄 다시 태어나기</button>
    `;
  }
}

renderMain();
</script>

</body>
</html>
